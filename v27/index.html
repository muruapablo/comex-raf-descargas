    ];

    const ComponentePipelineTracker = ({ doc, onClose }) => {
      if (!doc) return null;
      const isAnulacion = doc.estado === 'Q' || doc.estado === 'A';
      const steps = isAnulacion ? PIPELINE_ANULACION : PIPELINE_DESCARGA;
      
      const getStepIndex = (code) => {
        if (isAnulacion) {
          if (code === 'Q') return 0;
          if (code === 'A') return 1;
          return 0;
        } else {
          const idx = PIPELINE_DESCARGA.findIndex(s => s.code === code);
          return idx !== -1 ? idx : 0;
        }
      };

      const currentIdx = getStepIndex(doc.estado);

      return (
        <div className="bg-slate-900 text-white p-5 rounded-xl border border-slate-700 shadow-xl space-y-4">
          <div className="flex items-center justify-between border-b border-slate-800 pb-3">

          </p>

          <div className="grid grid-cols-2 md:grid-cols-6 gap-2 pt-2">
            {steps.map((step, idx) => {
              const isPassed = idx < currentIdx;
              const isCurrent = idx === currentIdx;

              return (
                <div 
                  key={step.code}
                  className={`p-3 rounded-lg border text-center transition-all ${
                    isCurrent 
                      ? 'bg-blue-900/80 border-sky-400 text-white shadow-lg shadow-sky-500/20 ring-2 ring-sky-400/50'

                      ? 'bg-emerald-950/60 border-emerald-600/80 text-emerald-200'

                >
                  <div className="flex items-center justify-center space-x-1 mb-1">
                    <span className="font-mono text-xs font-bold px-1.5 py-0.5 rounded bg-black/40">

                    {isCurrent && <span className="w-2 h-2 rounded-full bg-sky-400 animate-ping"></span>}
                    {isPassed && <span className="text-emerald-400 font-bold">✓</span>}
                  </div>
                  <div className="font-bold text-[11px] truncate">{step.name}</div>
                  <div className="text-[9px] text-slate-400 mt-1 leading-tight">{step.desc}</div>
                </div>
              );

          <div className="flex items-center justify-between text-[11px] text-slate-400 bg-slate-800/80 p-2.5 rounded-lg border border-slate-700 font-mono">

            <span>Transición G ➔ D: <strong className="text-emerald-400">Automatizada (RF-21)</strong></span>
            <span>Canal: <strong className="text-emerald-400">System.Threading.Channels</strong></span>
          </div>
        </div>
      );

    function App() {
      const [documentos, setDocumentos] = React.useState(MOCK_DOCUMENTOS);

      ]);

        const interval = setInterval(() => {
          setDocumentos(prevDocs => 
            prevDocs.map(doc => {

              // 1. E -> L (Solo si no está en espera declarativa manual RN-26)
              if (doc.estado === 'E' && !doc.modoManual) {
                setFifoLogs(l => [{ time: now, msg: `[Worker FIFO] Solicito estructura a Oracle DW9818 para ${doc.documento}: 'E' ➔ 'L'.`, type: 'sys' }, ...l]);
                return { ...doc, estado: 'L' };
              }
              
              // 2. L -> G (Estructura recibida de DW9818)
              if (doc.estado === 'L') {
                setFifoLogs(l => [{ time: now, msg: `[Worker FIFO] Estructura recibida de DW9818 para ${doc.documento}: 'L' ➔ 'G'. Consolidando en Mr_DescargaDetalle.`, type: 'sys' }, ...l]);
                return { ...doc, estado: 'G' };
              }

              // 3. G -> D (RF-21: TRANSICIÓN AUTOMÁTICA G ➔ D SIN INTERVENCIÓN MANUAL)
              if (doc.estado === 'G') {
                setFifoLogs(l => [{ time: now, msg: `[Worker FIFO] Estructura consolidada para ${doc.documento}: Transición automática 'G' ➔ 'D' (subsanando brecha legacy RF-21). Listo para procesar saldos.`, type: 'success' }, ...l]);
                return { ...doc, estado: 'D' };

              // 4. D -> P (Inicia descarga de saldos)

                setFifoLogs(l => [{ time: now, msg: `[Worker FIFO] Iniciando descarga de saldos para ${doc.documento}: 'D' ➔ 'P'. Operaciones destructivas bloqueadas.`, type: 'warn' }, ...l]);
                return { ...doc, estado: 'P', porcentaje: '45.00%' };

              // 5. P -> T (Finaliza descarga de saldos y verifica %)

                setFifoLogs(l => [{ time: now, msg: `[Worker FIFO] Finalizó descarga de saldos para ${doc.documento}: 'P' ➔ 'T'. Porcentaje verificado (100%).`, type: 'success' }, ...l]);
                return { ...doc, estado: 'T', porcentaje: '100.00%', sidom: '22/08/2026', estadoRepoStock: 'T' };

              // Anulación: Q -> A (SP Reversión de saldos)

                return { ...doc, estado: 'A', porcentaje: '100.00%', estadoRepoStock: 'A' };
              }
              return doc;
            })
          );
        }, 6000);
        return () => clearInterval(interval);

      const handleFacturaChange = (e) => {

      // Handlers de Acciones Bedside
      const handleSolicitarDescarga = (doc) => {
        setDocumentos(prev => prev.map(d => d.id === doc.id ? { ...d, estado: 'E', modoManual: false } : d));
        const now = new Date().toLocaleTimeString();
        setFifoLogs(l => [{ time: now, msg: `[POST /Solicitudes/Descarga] [Operador: m.garcia] Encoló ${doc.documento} (DESCARGAR modo auto). Procesamiento automático E➔L➔G➔D➔P➔T en marcha.`, type: 'warn' }, ...l]);

      // RN-26 / Endpoint #19: POST /descargas/{id}/continuar

                  >

                </div>
                <div className="flex justify-end space-x-2 pt-2">
                  <button onClick={() => setModalAnular(null)} className="px-4 py-2 bg-slate-200 text-slate-700 text-xs font-semibold rounded-md hover:bg-slate-300">Cancelar</button>
                  <button onClick={handleConfirmarAnulacion} className="px-4 py-2 bg-rose-600 text-white text-xs font-bold rounded-md hover:bg-rose-700 shadow-sm">Confirmar Anulación</button>
                </div>
              </div>
            </div>
          )}

          {modalParametrizaciones && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-xl shadow-2xl max-w-lg w-full p-6 space-y-4">
                <div className="flex justify-between items-center border-b pb-3">
                  <h3 className="text-sm font-bold text-slate-900">Parametrizaciones — {modalParametrizaciones.documento}</h3>
                  <button onClick={() => setModalParametrizaciones(null)} className="text-slate-400 hover:text-slate-600">✕</button>
                </div>
                <div className="text-xs space-y-2">
                  <p className="text-slate-600">Relación Insumo / Modelo de Conjuntos Cuenta Trabajo:</p>
                  <table className="w-full text-left border">
                    <thead className="bg-slate-100 font-semibold text-slate-700">
                      <tr><th className="p-2 border">Insumo / Producto</th><th className="p-2 border">Modelo Producto</th><th className="p-2 border">% Insumo</th></tr>
                    </thead>
                    <tbody>
                      <tr><td className="p-2 border font-mono">INS-7721-A</td><td className="p-2 border font-mono">0001962710</td><td className="p-2 border">100.00%</td></tr>
                      <tr><td className="p-2 border font-mono">INS-9901-B</td><td className="p-2 border font-mono">0001962888</td><td className="p-2 border">85.50%</td></tr>
                    </tbody>
                  </table>
                </div>
                <div className="flex justify-end pt-2">
                  <button onClick={() => setModalParametrizaciones(null)} className="px-4 py-1.5 bg-slate-800 text-white text-xs font-semibold rounded-md">Cerrar</button>
                </div>
              </div>
            </div>
          )}

          {modalEstructuras && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-xl shadow-2xl max-w-2xl w-full p-6 space-y-4">
                <div className="flex justify-between items-center border-b pb-3">
                  <h3 className="text-sm font-bold text-slate-900">Detalle de Estructura — {modalEstructuras.documento}</h3>
                  <button onClick={() => setModalEstructuras(null)} className="text-slate-400 hover:text-slate-600">✕</button>
                </div>
                <div className="text-xs space-y-3">
                  <div className="flex items-center justify-between bg-slate-50 p-2.5 rounded-lg border">
                    <input type="text" placeholder="Filtrar por Plano..." className="p-1.5 border rounded text-xs w-48 font-mono" />
                    <button onClick={() => showToast('Archivo Excel descargado exitosamente.')} className="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded shadow-sm">
                      📥 Exportar a Excel
                    </button>
                  </div>
                  <table className="w-full text-left border">
                    <thead className="bg-slate-100 font-semibold text-slate-700">
                      <tr><th className="p-2 border">Plano</th><th className="p-2 border">Cód. Producto</th><th className="p-2 border">Cantidad</th><th className="p-2 border">Precio</th></tr>
                    </thead>
                    <tbody className="divide-y font-mono">
                      <tr><td className="p-2 border">PL-882190</td><td className="p-2 border">PRD-00192</td><td className="p-2 border">1,500</td><td className="p-2 border">USD 12.50</td></tr>
                      <tr><td className="p-2 border">PL-990122</td><td className="p-2 border">PRD-00441</td><td className="p-2 border">800</td><td className="p-2 border">USD 45.00</td></tr>
                    </tbody>
                  </table>
                </div>
                <div className="flex justify-end pt-2">
                  <button onClick={() => setModalEstructuras(null)} className="px-4 py-1.5 bg-slate-800 text-white text-xs font-semibold rounded-md">Cerrar</button>
                </div>
              </div>
            </div>
          )}

          {/* Modal Reemplazar Estructura (RN-11 & RN-26) */}
          {modalReemplazar && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-xl shadow-2xl max-w-md w-full p-6 space-y-4">
                <div className="flex justify-between items-center border-b pb-3">
                  <h3 className="text-sm font-bold text-slate-900">Reemplazar Estructura (Excel)</h3>
                  <button onClick={() => setModalReemplazar(null)} className="text-slate-400 hover:text-slate-600">✕</button>
                </div>
                <p className="text-xs text-slate-600">
                  Cargue el archivo Excel (.xlsx) con el nuevo detalle para <strong className="font-mono">{modalReemplazar.documento}</strong>.
                </p>
                <div className="border-2 border-dashed border-slate-300 rounded-lg p-6 text-center bg-slate-50 hover:bg-slate-100 cursor-pointer transition-all">
                  <span className="text-3xl block mb-2">📊</span>
                  <span className="text-xs text-slate-600 font-semibold">Arrastre el archivo Excel o haga clic aquí</span>
                  <span className="block text-[10px] text-slate-400 mt-1">Soporta formatos .XLSX / .XLS</span>
                </div>
                <div className="text-[11px] text-slate-500 bg-blue-50 p-2.5 rounded border border-blue-200">
                  <strong>Rama A ('E'):</strong> Inserta detalle, transiciona a 'G' y auto-encola en FIFO (RN-26).<br/>
                  <strong>Rama B ('L'):</strong> Reemplazo transaccional DELETE+INSERT manteniendo 'L'.
                </div>
                <div className="flex justify-end space-x-2 pt-2">
                  <button onClick={() => setModalReemplazar(null)} className="px-4 py-1.5 bg-slate-200 text-slate-700 text-xs font-semibold rounded-md">Cancelar</button>
                  <button onClick={handleConfirmarReemplazarEstructura} className="px-4 py-1.5 bg-blue-900 text-white text-xs font-bold rounded-md hover:bg-blue-950">Subir y Procesar</button>
                </div>
              </div>
            </div>
          )}

          {/* Footer Corporativo STELLANTIS */}
          <footer className="bg-[#182848] text-white py-4 mt-auto border-t border-slate-800">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row items-center justify-between text-xs space-y-2 md:space-y-0">
              <div className="flex items-center space-x-4">
                <LogoStellantisSvg />
                <span className="text-slate-400">|</span>
                <span className="text-slate-300 font-medium">COMEX — Sistema de Registro de Afectación de Factura</span>
              </div>
              <div className="flex items-center space-x-4 text-slate-300">
                <span>Servidor: <strong className="text-emerald-400 font-mono">PreProducción</strong></span>
                <span>•</span>
                <span>Api.RAF v2.7</span>
                <span>•</span>
                <a href="../" className="text-sky-300 hover:text-white underline underline-offset-2">⟵ Ver versión anterior (v2.4)</a>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);

  </script>
</body>
</html>
